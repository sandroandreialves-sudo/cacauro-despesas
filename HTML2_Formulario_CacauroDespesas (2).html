<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacauro Despesas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .required {
            color: #e74c3c;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="number"] {
            font-size: 18px;
            font-weight: 600;
        }

        select {
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-reset:hover {
            background: #ebebeb;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .feedback {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback.sucesso {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
            display: block;
        }

        .feedback.erro {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info {
            background: #e7f3ff;
            color: #004085;
            border-left: 4px solid #0066cc;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 20px;
        }
    </style>
</head>
<const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvgRw0qZc5-dM_e53lsAeftVZdg5dVC3EL_VrfFghKXuN9fekMdo4casarU2G7E115/exec">
    <div class="container">
        <div class="header">
            <div class="logo">💪 Cacauro</div>
            <div class="subtitle">Registrar Despesa</div>
        </div>

        <div class="info">
            ℹ️ Preencha os dados da despesa. Leva menos de 1 minuto.
        </div>

        <div id="feedback" class="feedback"></div>

        <form id="formDespesa">
            <!-- Valor -->
            <div class="form-group">
                <label for="valor">Valor (R$) <span class="required">*</span></label>
                <input 
                    type="number" 
                    id="valor" 
                    name="valor" 
                    placeholder="0.00" 
                    step="0.01" 
                    min="0" 
                    required
                >
            </div>

            <!-- Categoria e Forma de Pagamento -->
            <div class="form-row">
                <div class="form-group">
                    <label for="categoria">Categoria <span class="required">*</span></label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione...</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Matéria-Prima">Matéria-Prima</option>
                        <option value="Logística">Logística</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Pessoal">Pessoal</option>
                        <option value="Telefone/Internet">Telefone/Internet</option>
                        <option value="Aluguel">Aluguel</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="formaPagamento">Forma de Pagamento</label>
                    <select id="formaPagamento" name="formaPagamento">
                        <option value="">Selecione...</option>
                        <option value="Pix">Pix</option>
                        <option value="Débito">Débito</option>
                        <option value="Crédito">Crédito</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Transferência">Transferência</option>
                    </select>
                </div>
            </div>

            <!-- Descrição -->
            <div class="form-group">
                <label for="descricao">Descrição</label>
                <input 
                    type="text" 
                    id="descricao" 
                    name="descricao" 
                    placeholder="Ex: Leite, pão, ingredientes..."
                >
            </div>

            <!-- Data do Gasto -->
            <div class="form-group">
                <label for="data">Data do Gasto <span class="required">*</span></label>
                <input 
                    type="date" 
                    id="data" 
                    name="data" 
                    required
                >
            </div>

            <!-- Observação -->
            <div class="form-group">
                <label for="observacao">Observação (opcional)</label>
                <textarea 
                    id="observacao" 
                    name="observacao" 
                    placeholder="Notas adicionais..."
                ></textarea>
            </div>

            <!-- Botões -->
            <div class="button-group">
                <button type="submit" class="btn-submit">Registrar</button>
                <button type="reset" class="btn-reset">Limpar</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #666;">Registrando...</p>
            </div>
        </form>
    </div>

    <script>
        // ==========================================
        // CONFIG
        // ==========================================
        // COLOQUE AQUI O URL DO GOOGLE APPS SCRIPT DEPOIS DE DEPLOYAR
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvgRw0qZc5-dM_e53lsAeftVZdg5dVC3EL_VrfFghKXuN9fekMdo4casarU2G7E115/exec"

        // ==========================================
        // INICIALIZAR DATA COM HOJE
        // ==========================================
        document.getElementById('data').valueAsDate = new Date();

        // ==========================================
        // SUBMETER FORMULÁRIO
        // ==========================================
        document.getElementById('formDespesa').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Pegar valores
            const valor = document.getElementById('valor').value;
            const categoria = document.getElementById('categoria').value;
            const descricao = document.getElementById('descricao').value;
            const formaPagamento = document.getElementById('formaPagamento').value;
            const data = document.getElementById('data').value;
            const observacao = document.getElementById('observacao').value;

            // Validar
            if (!valor || !categoria || !data) {
                mostrarFeedback('Por favor, preencha todos os campos obrigatórios', 'erro');
                return;
            }

            if (parseFloat(valor) <= 0) {
                mostrarFeedback('O valor deve ser maior que zero', 'erro');
                return;
            }

            // Mostrar loading
            document.getElementById('loading').style.display = 'block';

            try {
                // Enviar dados para Google Apps Script
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: new FormData(document.getElementById('formDespesa'))
                });

                const resultado = await response.json();

                if (resultado.sucesso) {
                    mostrarFeedback('✅ ' + resultado.mensagem, 'sucesso');
                    document.getElementById('formDespesa').reset();
                    document.getElementById('data').valueAsDate = new Date();
                    
                    // Auto-scroll para feedback
                    document.getElementById('feedback').scrollIntoView({ behavior: 'smooth' });
                } else {
                    mostrarFeedback('❌ ' + resultado.mensagem, 'erro');
                }
            } catch (erro) {
                console.error('Erro:', erro);
                mostrarFeedback('❌ Erro ao registrar. Verifique a URL do script.', 'erro');
            }

            document.getElementById('loading').style.display = 'none';
        });

        // ==========================================
        // MOSTRAR FEEDBACK
        // ==========================================
        function mostrarFeedback(mensagem, tipo) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = mensagem;
            feedback.className = 'feedback ' + tipo;
            
            // Auto-hide após 5 segundos se sucesso
            if (tipo === 'sucesso') {
                setTimeout(() => {
                    feedback.style.display = 'none';
                }, 5000);
            }
        }

        // ==========================================
        // LOG INICIAL
        // ==========================================
        console.log('🚀 Cacauro Despesas carregado');
        console.log('URL do script:', GOOGLE_SCRIPT_URL);
    </script>
</body>
</html>
